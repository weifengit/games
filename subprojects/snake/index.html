<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="color-scheme" content="dark" />
<title>贪吃蛇 · Snake</title>
<style>
  :root {
    --bg: #070b16;
    --text: #e8eefc;
    --muted: #8b9ac0;
    --line: rgba(255, 255, 255, 0.08);
    --mint: #3de8c8;
    --blue: #4c9bff;
    --pink: #ff6b85;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1100px 620px at 50% -12%, #17244e 0%, rgba(7, 11, 22, 0) 62%),
      var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  .app {
    width: min(94vw, 560px);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---------- HUD ---------- */
  .hud { display: flex; gap: 10px; }

  .stat {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.015));
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat .k {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat .v {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .stat.hi .v { color: var(--mint); }

  /* ---------- 棋盘 ---------- */
  .stage {
    position: relative;
    border: 1px solid var(--line);
    border-radius: 22px;
    overflow: hidden;
    touch-action: none;
    box-shadow:
      0 24px 60px -20px rgba(0, 0, 0, 0.95),
      inset 0 0 0 1px rgba(255, 255, 255, 0.03);
  }

  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1; }

  /* ---------- 遮罩层 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(6, 10, 20, 0.72);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .card { padding: 26px 30px; max-width: 88%; text-align: center; }
  .card h1 {
    margin: 0 0 10px;
    font-size: clamp(24px, 6.2vw, 34px);
    letter-spacing: 0.02em;
    background: linear-gradient(120deg, #9bffc6, #3de8c8 46%, #4c9bff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.75; }
  .card p b { color: var(--text); }

  .btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    padding: 12px 32px;
    border-radius: 999px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #04121f;
    background: linear-gradient(135deg, #9bffc6, #3de8c8 55%, #4c9bff);
    box-shadow: 0 12px 32px -10px rgba(61, 232, 200, 0.75);
    transition: transform 0.12s ease, box-shadow 0.2s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 16px 36px -10px rgba(61, 232, 200, 0.85); }
  .btn:active { transform: translateY(1px) scale(0.99); }

  /* ---------- 移动端方向键 ---------- */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 10px;
  }
  .dpad button {
    appearance: none;
    height: 56px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
    color: var(--text);
    font-size: 20px;
    line-height: 1;
    touch-action: none;
    user-select: none;
  }
  .dpad button:active {
    background: rgba(61, 232, 200, 0.18);
    border-color: rgba(61, 232, 200, 0.45);
  }
  .dpad .up { grid-area: 1 / 2 / 2 / 3; }
  .dpad .left { grid-area: 2 / 1 / 3 / 2; }
  .dpad .down { grid-area: 2 / 2 / 3 / 3; }
  .dpad .right { grid-area: 2 / 3 / 3 / 4; }

  .tip { text-align: center; color: var(--muted); font-size: 12.5px; letter-spacing: 0.03em; }

  @media (hover: none) and (pointer: coarse) {
    .dpad { display: grid; }
    .tip { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stat"><span class="k">分数</span><span class="v" id="score">0</span></div>
    <div class="stat hi"><span class="k">最高</span><span class="v" id="best">0</span></div>
    <div class="stat"><span class="k">速度</span><span class="v" id="level">1</span></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="game" width="600" height="600"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h1 id="ovTitle">贪吃蛇</h1>
        <p id="ovText"></p>
        <button class="btn" id="ovBtn">开始游戏</button>
      </div>
    </div>
  </div>

  <div class="dpad" id="dpad">
    <button class="up" data-dir="up" aria-label="上">▲</button>
    <button class="left" data-dir="left" aria-label="左">◀</button>
    <button class="down" data-dir="down" aria-label="下">▼</button>
    <button class="right" data-dir="right" aria-label="右">▶</button>
  </div>

  <footer class="tip">方向键 / WASD 移动 · 空格暂停 · R 重开</footer>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 常量
   * ============================================================ */
  const GRID = 20;          // 20 × 20 格
  const BASE_STEP = 140;    // 初始步长（毫秒 / 格）
  const MIN_STEP = 62;      // 最快步长下限
  const SPEED_UP = 4;       // 每吃一个果实缩短的毫秒数
  const MAX_DT_MIN = 200;   // dt 钳制下限：必须 ≥ stepMs，否则卡顿时游戏永久变慢
  const GUARD = 5;          // 每帧最多补跑的逻辑步数（须满足 GUARD*MIN_STEP ≥ 钳制值）
  const STORE_KEY = 'snake:best:v1';

  const STATE = { MENU: 'menu', PLAYING: 'playing', PAUSED: 'paused', OVER: 'over', WIN: 'win' };

  /* ============================================================
   * DOM
   * ============================================================ */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovBtn = document.getElementById('ovBtn');
  const elScore = document.getElementById('score');
  const elBest = document.getElementById('best');
  const elLevel = document.getElementById('level');
  const dpad = document.getElementById('dpad');

  /* ============================================================
   * 存储（隐私模式 / file:// 下可能抛错，降级为内存变量）
   * ============================================================ */
  const store = {
    get() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        return raw ? (parseInt(raw, 10) || 0) : 0;
      } catch (e) { return 0; }
    },
    set(v) {
      try { localStorage.setItem(STORE_KEY, String(v)); } catch (e) { /* 忽略 */ }
    }
  };

  /* ============================================================
   * 状态
   * ============================================================ */
  let state = STATE.MENU;
  let snake = [];              // 头在 [0]
  let dir = { x: 1, y: 0 };    // 当前生效方向
  let queue = [];              // 输入缓冲：每个逻辑帧消费一个
  let food = null;
  let score = 0;
  let eaten = 0;
  let best = store.get();
  let stepMs = BASE_STEP;
  let acc = 0;                 // 逻辑步长累加器
  let last = 0;                // 上一帧时间戳
  let curT = 0;                // 渲染插值进度 0..1
  let lastGrew = false;        // 上一逻辑步是否增长（决定尾巴是否收缩）
  let shakeT = 0;              // 结束抖动剩余时长
  let cell = 30;               // 单格 CSS 像素
  let cssSize = 600;           // 画布 CSS 边长
  let bgCanvas = null;         // 预渲染棋盘底图
  let foodSprite = null;       // 预渲染果实 + 光晕
  let foodSpriteSize = 0;

  /* ============================================================
   * 画布尺寸 / 预渲染
   * ============================================================ */
  function roundRectPath(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    if (typeof c.roundRect === 'function') { c.roundRect(x, y, w, h, r); return; }
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function dpr() { return Math.min(window.devicePixelRatio || 1, 3); }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width) return;
    cssSize = Math.round(rect.width);
    cell = cssSize / GRID;

    const ratio = dpr();
    canvas.width = Math.round(cssSize * ratio);
    canvas.height = Math.round(cssSize * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    buildBackground();
    buildFoodSprite();
  }

  // 棋盘底图只画一次（圆角底板 + 交错圆角格）
  function buildBackground() {
    const ratio = dpr();
    const c = document.createElement('canvas');
    c.width = Math.round(cssSize * ratio);
    c.height = Math.round(cssSize * ratio);
    const g = c.getContext('2d');
    g.setTransform(ratio, 0, 0, ratio, 0, 0);

    g.fillStyle = '#0d1326';
    roundRectPath(g, 0, 0, cssSize, cssSize, cell * 0.7);
    g.fill();

    const pad = Math.max(1, cell * 0.07);
    const radius = cell * 0.3;
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        g.fillStyle = (x + y) % 2
          ? 'rgba(255,255,255,0.032)'
          : 'rgba(255,255,255,0.014)';
        roundRectPath(g, x * cell + pad, y * cell + pad, cell - pad * 2, cell - pad * 2, radius);
        g.fill();
      }
    }
    bgCanvas = c;
  }

  // 果实：光晕 + 果体 + 高光，一次性预渲染（避免每帧 shadowBlur / 径向渐变）
  function buildFoodSprite() {
    const size = Math.max(28, cell * 2.6);
    const ratio = dpr();
    const c = document.createElement('canvas');
    c.width = Math.round(size * ratio);
    c.height = Math.round(size * ratio);
    const g = c.getContext('2d');
    g.setTransform(ratio, 0, 0, ratio, 0, 0);

    const cx = size / 2, cy = size / 2, r = cell * 0.3;

    const glow = g.createRadialGradient(cx, cy, r * 0.25, cx, cy, size / 2);
    glow.addColorStop(0, 'rgba(255,107,133,0.55)');
    glow.addColorStop(0.45, 'rgba(255,107,133,0.16)');
    glow.addColorStop(1, 'rgba(255,107,133,0)');
    g.fillStyle = glow;
    g.beginPath();
    g.arc(cx, cy, size / 2, 0, Math.PI * 2);
    g.fill();

    const body = g.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.08, cx, cy, r);
    body.addColorStop(0, '#ffd9e0');
    body.addColorStop(0.38, '#ff6b85');
    body.addColorStop(1, '#c31f47');
    g.fillStyle = body;
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.fill();

    g.fillStyle = 'rgba(255,255,255,0.78)';
    g.beginPath();
    g.arc(cx - r * 0.34, cy - r * 0.38, r * 0.22, 0, Math.PI * 2);
    g.fill();

    foodSprite = c;
    foodSpriteSize = size;
  }

  /* ============================================================
   * 游戏逻辑
   * ============================================================ */
  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    eaten = 0;
    stepMs = BASE_STEP;
    acc = 0;
    curT = 0;
    lastGrew = false;
    shakeT = 0;
    spawnFood();
    updateHUD();
  }

  // 从「未被蛇占用」的格子中均匀取一个：天然不会重叠，也不会满格死循环
  function spawnFood() {
    const occupied = new Set();
    for (let i = 0; i < snake.length; i++) occupied.add(snake[i].x + ',' + snake[i].y);

    const free = [];
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        if (!occupied.has(x + ',' + y)) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  // 入队方向：与「队列末方向（或当前生效方向）」比较，杜绝 180° 反向自杀
  function pushDir(nx, ny) {
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if (nx === -ref.x && ny === -ref.y) return; // 反向，丢弃
    if (nx === ref.x && ny === ref.y) return;   // 重复，丢弃
    if (queue.length < 3) queue.push({ x: nx, y: ny });
  }

  function update() {
    if (queue.length) dir = queue.shift();

    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) { gameOver(); return; }

    const grow = !!food && nx === food.x && ny === food.y;

    // 撞自身：若本步不增长，尾格会腾出来，因此豁免最后一节
    const limit = grow ? snake.length : snake.length - 1;
    for (let i = 0; i < limit; i++) {
      if (snake[i].x === nx && snake[i].y === ny) { gameOver(); return; }
    }

    snake.unshift({ x: nx, y: ny });
    lastGrew = grow;

    if (grow) {
      score += 10;
      eaten += 1;
      stepMs = Math.max(MIN_STEP, BASE_STEP - eaten * SPEED_UP);
      if (score > best) { best = score; store.set(best); } // 破纪录立即写，中途刷新不丢
      if (snake.length >= GRID * GRID) { spawnFood(); updateHUD(); win(); return; }
      spawnFood();
      updateHUD();
    } else {
      snake.pop();
    }
  }

  function updateHUD() {
    elScore.textContent = String(score);
    elBest.textContent = String(best);
    elLevel.textContent = String(eaten + 1);
  }

  function saveBest() {
    if (score > best) { best = score; store.set(best); }
    updateHUD();
  }

  /* ============================================================
   * 状态切换
   * ============================================================ */
  function showOverlay(title, html, btn) {
    ovTitle.textContent = title;
    ovText.innerHTML = html;
    ovBtn.textContent = btn;
    overlay.classList.remove('hidden');
  }

  function start() {
    reset();
    state = STATE.PLAYING;
    last = 0;
    acc = 0;
    curT = 0;
    overlay.classList.add('hidden');
  }

  function pause() {
    if (state !== STATE.PLAYING) return;
    state = STATE.PAUSED;
    showOverlay('已暂停', '空格继续 · R 重新开始', '继续游戏');
  }

  function resume() {
    if (state !== STATE.PAUSED) return;
    state = STATE.PLAYING;
    last = 0; // 重置时间基准，避免累计一个巨大的 dt
    overlay.classList.add('hidden');
  }

  function gameOver() {
    state = STATE.OVER;
    shakeT = 340;
    saveBest();
    showOverlay('游戏结束', '本局得分 <b>' + score + '</b> · 最高 <b>' + best + '</b><br>按空格或点击按钮再来一局', '再来一局');
  }

  function win() {
    state = STATE.WIN;
    saveBest();
    showOverlay('🎉 通关！', '你填满了整个棋盘，得分 <b>' + score + '</b>', '再玩一次');
  }

  /* ============================================================
   * 渲染
   * ============================================================ */
  function strokePath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  function drawFood(now) {
    if (!food) return;
    const pulse = 1 + Math.sin(now / 260) * 0.07;
    const size = foodSpriteSize * pulse;
    const cx = (food.x + 0.5) * cell;
    const cy = (food.y + 0.5) * cell;
    ctx.drawImage(foodSprite, cx - size / 2, cy - size / 2, size, size);
  }

  function drawSnake() {
    if (!snake.length) return;
    const p = curT;

    const pts = [];
    const head = snake[0];
    // 头部按插值向前延伸，尾巴按插值收缩 —— 视觉上连续滑动而非跳格
    pts.push({ x: (head.x + 0.5 + dir.x * p) * cell, y: (head.y + 0.5 + dir.y * p) * cell });

    for (let i = 0; i < snake.length - 1; i++) {
      pts.push({ x: (snake[i].x + 0.5) * cell, y: (snake[i].y + 0.5) * cell });
    }

    const tail = snake[snake.length - 1];
    if (lastGrew || snake.length === 1) {
      pts.push({ x: (tail.x + 0.5) * cell, y: (tail.y + 0.5) * cell });
    } else {
      const prev = snake[snake.length - 2];
      pts.push({
        x: (tail.x + (prev.x - tail.x) * p + 0.5) * cell,
        y: (tail.y + (prev.y - tail.y) * p + 0.5) * cell
      });
    }

    const a = pts[0];
    const b = pts[pts.length - 1];
    let bodyStyle;
    if (Math.hypot(b.x - a.x, b.y - a.y) < 1) {
      bodyStyle = '#5cf0d0';
    } else {
      const grad = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      grad.addColorStop(0, '#9bffc6');
      grad.addColorStop(0.35, '#3de8c8');
      grad.addColorStop(1, '#2e7bf6');
      bodyStyle = grad;
    }

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // 外发光
    ctx.strokeStyle = 'rgba(61,232,200,0.18)';
    ctx.lineWidth = cell * 0.96;
    strokePath(pts);

    // 蛇身
    ctx.strokeStyle = bodyStyle;
    ctx.lineWidth = cell * 0.78;
    strokePath(pts);

    // 眼睛
    const hx = a.x, hy = a.y;
    const ex = dir.x, ey = dir.y;
    const px = -ey, py = ex;
    const eyeFwd = cell * 0.17;
    const eyeSide = cell * 0.19;
    const eyeR = cell * 0.085;

    ctx.fillStyle = '#06231d';
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.arc(hx + ex * eyeFwd + px * eyeSide * s, hy + ey * eyeFwd + py * eyeSide * s, eyeR, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let s = -1; s <= 1; s += 2) {
      ctx.beginPath();
      ctx.arc(
        hx + ex * eyeFwd + px * eyeSide * s - eyeR * 0.3,
        hy + ey * eyeFwd + py * eyeSide * s - eyeR * 0.3,
        eyeR * 0.38, 0, Math.PI * 2
      );
      ctx.fill();
    }
  }

  function render(now) {
    if (!bgCanvas) return;
    ctx.clearRect(0, 0, cssSize, cssSize);

    let ox = 0, oy = 0;
    if (shakeT > 0) {
      const k = shakeT / 340;
      ox = Math.sin(now / 22) * 4 * k;
      oy = Math.cos(now / 17) * 4 * k;
    }

    ctx.save();
    ctx.translate(ox, oy);
    ctx.drawImage(bgCanvas, 0, 0, cssSize, cssSize);
    drawFood(now);
    drawSnake();
    ctx.restore();
  }

  /* ============================================================
   * 主循环：requestAnimationFrame + 固定逻辑步长（accumulator）
   * ============================================================ */
  function frame(now) {
    requestAnimationFrame(frame);

    if (!last) last = now;
    let dt = now - last;
    last = now;
    const dtClamp = Math.max(MAX_DT_MIN, stepMs * 2); // ≥ stepMs，卡顿不拖慢真实时间
    if (dt > dtClamp) dt = dtClamp;                   // 切后台回来不瞬移

    if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);

    if (state === STATE.PLAYING) {
      acc += dt;
      let guard = 0;
      while (acc >= stepMs && state === STATE.PLAYING && guard < GUARD) {
        acc -= stepMs;
        guard += 1;
        update();
      }
      if (acc >= stepMs) acc = 0; // 债务清零，避免集中爆发式"突然窜出"
      curT = state === STATE.PLAYING ? Math.min(1, acc / stepMs) : 0;
    }

    render(now);
  }

  /* ============================================================
   * 输入
   * ============================================================ */
  const MOVE_KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0]
  };

  window.addEventListener('keydown', function (e) {
    const k = e.code;              // e.code 不受 CapsLock / 键盘布局影响
    if (e.isComposing || e.repeat) return;

    // 只拦自己处理的键，F5 / F12 仍可用
    if (k === 'Space' || k === 'Enter' || MOVE_KEYS[k]) e.preventDefault();

    if (state === STATE.PLAYING && MOVE_KEYS[k]) {
      const d = MOVE_KEYS[k];
      pushDir(d[0], d[1]);
      return;
    }

    if (k === 'KeyR') { start(); return; }

    if (k === 'Space' || k === 'Enter') {
      if (state === STATE.MENU || state === STATE.OVER || state === STATE.WIN) start();
      else if (state === STATE.PLAYING) pause();
      else if (state === STATE.PAUSED) resume();
    }
  }, { passive: false });

  ovBtn.addEventListener('click', function () {
    if (state === STATE.PAUSED) resume();
    else start();
  });

  // 移动端：滑动 + 方向键
  const DPAD_DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  dpad.addEventListener('pointerdown', function (e) {
    const btn = e.target.closest('button[data-dir]');
    if (!btn) return;
    e.preventDefault();
    const d = DPAD_DIRS[btn.dataset.dir];
    if (state === STATE.PLAYING) pushDir(d[0], d[1]);
    else if (state === STATE.PAUSED) resume();
    else start();
  });

  let touchX = 0, touchY = 0, touching = false;

  stage.addEventListener('touchstart', function (e) {
    const t = e.changedTouches[0];
    touchX = t.clientX;
    touchY = t.clientY;
    touching = true;
  }, { passive: true });

  stage.addEventListener('touchmove', function (e) {
    if (state === STATE.PLAYING) e.preventDefault(); // 阻止滑动时页面跟着滚
  }, { passive: false });

  stage.addEventListener('touchend', function (e) {
    if (!touching) return;
    touching = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchX;
    const dy = t.clientY - touchY;
    if (Math.hypot(dx, dy) < 24) return;
    if (state !== STATE.PLAYING) return;
    if (Math.abs(dx) > Math.abs(dy)) pushDir(dx > 0 ? 1 : -1, 0);
    else pushDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  // 切到后台自动暂停
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === STATE.PLAYING) pause();
  });

  /* ============================================================
   * 启动
   * ============================================================ */
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(resize).observe(canvas);
  } else {
    window.addEventListener('resize', resize);
  }

  resize();
  reset();
  state = STATE.MENU;
  showOverlay(
    '贪吃蛇',
    '方向键 / WASD 控制方向<br>吃到果实得分并加速<br><br>空格暂停 · R 重开',
    '开始游戏'
  );

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
